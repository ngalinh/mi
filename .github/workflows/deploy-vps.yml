name: Deploy mi runner to Windows VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mi-vps
  cancel-in-progress: false

env:
  APP_DIR: ${{ vars.MI_DEPLOY_DIR || 'C:\apps\mi' }}
  HEALTHCHECK_URL: ${{ vars.MI_HEALTHCHECK_URL || 'http://127.0.0.1:8090/health' }}

jobs:
  deploy:
    name: Deploy mi runner
    runs-on: [self-hosted, Windows, X64, vps]
    timeout-minutes: 20

    steps:
      - name: Deploy exact commit and restart mi
        shell: powershell
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($tool in @('git', 'node', 'npm', 'npx', 'pm2')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing required command: $tool"
            }
          }

          # Serialize deployments from Xeko and mi on the shared Windows VPS.
          $lockPath = Join-Path $env:TEMP 'ngalinh-vps-deploy.lock'
          $lockStream = $null
          $deadline = (Get-Date).AddSeconds(180)
          while ($null -eq $lockStream) {
            try {
              $lockStream = [System.IO.File]::Open(
                $lockPath,
                [System.IO.FileMode]::OpenOrCreate,
                [System.IO.FileAccess]::ReadWrite,
                [System.IO.FileShare]::None
              )
            } catch [System.IO.IOException] {
              if ((Get-Date) -ge $deadline) {
                throw 'Another VPS deployment did not release the lock in time.'
              }
              Start-Sleep -Seconds 3
            }
          }

          try {
            if ((Test-Path -LiteralPath $env:APP_DIR) -and
                -not (Test-Path -LiteralPath $env:APP_DIR -PathType Container)) {
              throw "$env:APP_DIR exists but is not a directory."
            }

            New-Item -ItemType Directory -Path $env:APP_DIR -Force | Out-Null
            $gitDir = Join-Path $env:APP_DIR '.git'
            if (-not (Test-Path -LiteralPath $gitDir -PathType Container)) {
              if (@(Get-ChildItem -LiteralPath $env:APP_DIR -Force).Count -gt 0) {
                throw "$env:APP_DIR is not empty and is not a Git checkout."
              }
              git clone --no-checkout $env:REPOSITORY_URL $env:APP_DIR
              if ($LASTEXITCODE -ne 0) { throw "git clone failed with exit code $LASTEXITCODE" }
            }

            git -C $env:APP_DIR remote set-url origin $env:REPOSITORY_URL
            if ($LASTEXITCODE -ne 0) { throw "git remote failed with exit code $LASTEXITCODE" }
            git -C $env:APP_DIR fetch --prune origin $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed with exit code $LASTEXITCODE" }
            git -C $env:APP_DIR checkout --force --detach $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "git checkout failed with exit code $LASTEXITCODE" }

            $envFile = Join-Path $env:APP_DIR '.env'
            if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) {
              throw "Missing $envFile. Create it on the VPS; never commit production secrets."
            }

            $serverDir = $env:APP_DIR
            npm --prefix $serverDir ci --omit=dev
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE" }

            Push-Location $serverDir
            try {
              npx playwright install chromium
              if ($LASTEXITCODE -ne 0) { throw "Playwright install failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }

            Push-Location $env:APP_DIR
            try {
              pm2 startOrReload ecosystem.config.js --only mi-runner --update-env
              if ($LASTEXITCODE -ne 0) { throw "PM2 reload failed with exit code $LASTEXITCODE" }
              pm2 save
              if ($LASTEXITCODE -ne 0) { throw "PM2 save failed with exit code $LASTEXITCODE" }
            } finally {
              Pop-Location
            }

            $healthy = $false
            for ($attempt = 1; $attempt -le 10; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
                  $healthy = $true
                  break
                }
              } catch {
                if ($attempt -eq 10) {
                  throw "mi health check failed after 10 attempts: $($_.Exception.Message)"
                }
              }
              Start-Sleep -Seconds 3
            }
            if (-not $healthy) { throw 'mi health check did not return HTTP 2xx.' }

            Write-Host "mi deployed at commit $env:GITHUB_SHA"
          } finally {
            if ($null -ne $lockStream) { $lockStream.Dispose() }
          }
